{% extends "base.html" %}

{% block title %}Update Student{% endblock %}

{% block content %}
<section class="card form-card">
    <h1>Update Student</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" class="student-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="name">Student Name</label>
            <input id="name" type="text" name="name" value="{{ student.name }}" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input id="email" type="email" name="email" value="{{ student.email }}" required>
        </div>

        <div class="form-group">
            <label for="course">Course</label>
            <select id="course" name="course" required>
                {% for course in courses %}
                <option value="{{ course.id }}" {% if course.id==student.course_id %}selected{% endif %}>
                    {{ course.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit" class="btn btn-primary">
            Save Changes
        </button>
        <a href="{% url 'home' %}" class="btn btn-secondary">Cancel</a>
    </form>
</section>
{% endblock %}
